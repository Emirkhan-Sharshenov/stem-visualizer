    <script>
      // STEM Lab theme before the first paint: night by default, or the one the visitor chose
      (function () {
        var t = null;
        try { t = localStorage.getItem('sv-theme'); } catch (e) {}
        var dark = t !== 'light';
        var r = document.documentElement;
        r.setAttribute('data-theme', dark ? 'stem-lab-dark' : 'stem-lab');
        r.classList.toggle('dark', dark);
        r.classList.toggle('light', !dark);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', dark ? '#070B16' : '#F7F9FC');
      })();
    </script>
